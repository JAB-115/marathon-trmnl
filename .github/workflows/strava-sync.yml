name: Strava sync

on:
  schedule:
    # Every 30 minutes. GitHub disables schedules after 60 days of repo inactivity;
    # the commits this makes count as activity, so it stays alive while you train.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strava-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch activities
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python sync_strava.py

      - name: Commit only if something changed
        run: |
          git config user.name "strava-sync"
          git config user.email "actions@users.noreply.github.com"
          git add activity.json
          if git diff --staged --quiet; then
            echo "No change, nothing to commit"
          else
            git commit -m "Strava sync $(date -u +%FT%TZ)"
            git push
          fi
